version: "3.8"

services:

  mongodb:
    image: mongo:7
    container_name: archhub-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_NAME:-archhub}
    volumes:
      - ./db_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--username", "${MONGO_USER}",
             "--password", "${MONGO_PASSWORD}", "--authenticationDatabase",
             "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: archhub-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - MONGO_URL=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/${DB_NAME:-archhub}?authSource=admin
      - DB_NAME=${DB_NAME:-archhub}
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "localhost:8091:8001"
    networks:
      - internal
      - external

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        REACT_APP_BACKEND_URL: https://api.archhub.dev
    container_name: archhub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "localhost:8080:80"
    networks:
      - external

networks:
  internal:
    driver: bridge
    internal: true
  external:
    driver: bridge
